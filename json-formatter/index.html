<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Free modern JSON Formatter tool with responsive design." />
    <meta name="keywords" content="JSON Formatter, JSON Beautifier, JSON Viewer" />
    <meta name="author" content="JSON Formatter" />

    <title>JSON Formatter</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-light text-dark">

    <!-- Header -->
    <header class="border-bottom bg-white shadow-none sticky-top">
        <div class="container py-3">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="h4 mb-0 fw-bold">
                    <i class="fa-solid fa-code text-primary me-2"></i>
                    JSON Formatter
                </h1>

                <button class="btn btn-primary btn-sm" id="formatBtn">
                    <i class="fa-solid fa-wand-magic-sparkles me-1"></i>
                    Format JSON
                </button>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="flex-grow-1">
        <div class="container py-5">

            <!-- Description -->
            <div class="text-center mb-5">
                <h2 class="fw-bold mb-3">Modern JSON Formatter Tool</h2>
                <p class="text-secondary mx-auto" style="max-width: 700px;">
                    Beautify, validate, and organize your JSON data instantly with this clean and responsive JSON Formatter.
                </p>
            </div>

            <!-- Ad Space Top -->
            <div class="bg-white border rounded-4 p-4 text-center mb-4 shadow-sm">
                <small class="text-muted d-block mb-2">Advertisement Space</small>
                <div class="text-secondary">
                    728 x 90 Banner Ad
                </div>
            </div>

            <!-- Formatter -->
            <div class="row g-4">
                <div class="col-12">
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-body p-4">

                            <label class="form-label fw-semibold">
                                <i class="fa-solid fa-file-code me-2 text-primary"></i>
                                Paste JSON
                            </label>

                            <textarea 
                                id="jsonInput"
                                class="form-control mb-3"
                                rows="12"
                                placeholder='{"name":"John","age":25}'
                            ></textarea>

                            <div class="d-flex flex-wrap gap-2 mb-3">
                                <button class="btn btn-primary" id="beautifyBtn">
                                    <i class="fa-solid fa-check me-1"></i>
                                    Beautify
                                </button>

                                <button class="btn btn-outline-secondary" id="minifyBtn">
                                    <i class="fa-solid fa-compress me-1"></i>
                                    Minify
                                </button>

                                <button class="btn btn-outline-danger" id="clearBtn">
                                    <i class="fa-solid fa-trash me-1"></i>
                                    Clear
                                </button>

                                <button class="btn btn-outline-success" id="copyBtn">
                                    <i class="fa-solid fa-copy me-1"></i>
                                    Copy
                                </button>
                            </div>

                            <div id="alertBox"></div>

                        </div>
                    </div>
                </div>
            </div>

            <!-- Ad Space Bottom -->
            <div class="bg-white border rounded-4 p-4 text-center mt-4 shadow-sm">
                <small class="text-muted d-block mb-2">Advertisement Space</small>
                <div class="text-secondary">
                    Responsive Ad Area
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-top mt-auto">
        <div class="container py-3 text-center">
            <small class="text-muted">
                © 2026 JSON Formatter. All rights reserved.
            </small>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script -->
    <script>
        const jsonInput = document.getElementById('jsonInput');
        const beautifyBtn = document.getElementById('beautifyBtn');
        const minifyBtn = document.getElementById('minifyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const formatBtn = document.getElementById('formatBtn');
        const alertBox = document.getElementById('alertBox');

        function showAlert(message, type) {
            alertBox.innerHTML = `
                <div class="alert alert-${type} mt-3" role="alert">
                    ${message}
                </div>
            `;
        }

        function beautifyJSON() {
            try {
                const parsed = JSON.parse(jsonInput.value);
                jsonInput.value = JSON.stringify(parsed, null, 4);
                showAlert('JSON formatted successfully.', 'success');
            } catch (error) {
                showAlert('Invalid JSON format.', 'danger');
            }
        }

        function minifyJSON() {
            try {
                const parsed = JSON.parse(jsonInput.value);
                jsonInput.value = JSON.stringify(parsed);
                showAlert('JSON minified successfully.', 'success');
            } catch (error) {
                showAlert('Invalid JSON format.', 'danger');
            }
        }

        beautifyBtn.addEventListener('click', beautifyJSON);
        formatBtn.addEventListener('click', beautifyJSON);

        minifyBtn.addEventListener('click', () => {
            minifyJSON();
        });

        clearBtn.addEventListener('click', () => {
            jsonInput.value = '';
            alertBox.innerHTML = '';
        });

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(jsonInput.value);

            showAlert('JSON copied to clipboard.', 'primary');
        });
    </script>

</body>
</html>
