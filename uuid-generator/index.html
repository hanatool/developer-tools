<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Modern UUID Generator tool to create secure random UUIDs instantly. Responsive Bootstrap design with minimal and clean interface.">
    <meta name="keywords" content="UUID Generator, UUID, GUID, Random ID Generator, Bootstrap Tool">
    <meta name="author" content="UUID Generator">
    <meta name="robots" content="index, follow">

    <title>UUID Generator</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light text-dark">

    <!-- Header -->
    <header class="border-bottom bg-white shadow-none sticky-top">
        <nav class="navbar navbar-expand-lg navbar-light bg-white">
            <div class="container">
                <h1 class="h4 mb-0 fw-bold text-dark">
                    <i class="fa-solid fa-fingerprint me-2 text-primary"></i>
                    UUID Generator
                </h1>

                <button class="btn btn-primary btn-sm" onclick="generateUUID()">
                    <i class="fa-solid fa-rotate me-1"></i>
                    Generate
                </button>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="flex-grow-1">
        <div class="container py-5">

            <!-- Description -->
            <div class="row justify-content-center mb-4">
                <div class="col-lg-8 text-center">
                    <h2 class="fw-bold text-dark mb-3">
                        Generate Random UUID Instantly
                    </h2>

                    <p class="text-secondary mb-0">
                        Create secure and unique UUIDs quickly using this modern online UUID generator tool.
                        Fast, responsive, minimal, and easy to use.
                    </p>
                </div>
            </div>

            <!-- UUID Box -->
            <div class="row justify-content-center mb-4">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-body p-4">

                            <label class="form-label fw-semibold text-dark">
                                Generated UUID
                            </label>

                            <div class="input-group input-group-lg mb-3">
                                <input 
                                    type="text" 
                                    id="uuidOutput" 
                                    class="form-control" 
                                    readonly
                                    placeholder="Click generate button..."
                                >

                                <button class="btn btn-outline-primary" onclick="copyUUID()">
                                    <i class="fa-regular fa-copy"></i>
                                </button>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                                <button class="btn btn-primary px-4" onclick="generateUUID()">
                                    <i class="fa-solid fa-bolt me-2"></i>
                                    Generate UUID
                                </button>

                                <button class="btn btn-outline-secondary px-4" onclick="copyUUID()">
                                    <i class="fa-solid fa-copy me-2"></i>
                                    Copy
                                </button>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

            <!-- Ads Area -->
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-body text-center py-5">

                            <div class="mb-3">
                                <i class="fa-solid fa-rectangle-ad fa-2x text-secondary"></i>
                            </div>

                            <h3 class="h6 fw-bold text-dark">
                                Advertisement Space
                            </h3>

                            <p class="text-secondary mb-0">
                                Your advertisement banner can be placed here.
                            </p>

                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-top mt-auto">
        <nav class="navbar navbar-expand-lg navbar-light bg-white">
            <div class="text-center text-secondary small">
                © 2026 UUID Generator. All rights reserved.
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script -->
    <script>
        function generateUUID() {
            const uuid = crypto.randomUUID();
            document.getElementById('uuidOutput').value = uuid;
        }

        function copyUUID() {
            const input = document.getElementById('uuidOutput');

            if (!input.value) {
                alert('Please generate a UUID first.');
                return;
            }

            navigator.clipboard.writeText(input.value);

            alert('UUID copied to clipboard.');
        }

        // Auto generate on load
        window.onload = generateUUID;
    </script>

</body>
</html>
